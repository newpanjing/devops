root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/dbsync ./cmd/server/main.go"
  bin = "tmp/dbsync"
  full_bin = "APP_ENV=dev APP_USER=air ./tmp/dbsync"
  include_ext = ["go", "tpl", "tmpl", "html", "js"]
  exclude_ext = ["tmp", "vendor"]
  include_dir = ["cmd", "internal", "frontend"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  poll = false
  poll_interval = 0
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = "0s"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true